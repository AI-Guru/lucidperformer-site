<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 160" role="img" aria-label="LucidPerformer">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(8 16)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#141516" stroke="#3fd8dc" stroke-width="6"/>
    <g fill="#3fd8dc">
      <rect x="26" y="26" width="20" height="20" rx="5" filter="url(#glow)"/>
      <rect x="54" y="26" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="82" y="26" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="26" y="54" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="54" y="54" width="20" height="20" rx="5" filter="url(#glow)"/>
      <rect x="82" y="54" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="26" y="82" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="54" y="82" width="20" height="20" rx="5" opacity="0.25"/>
      <rect x="82" y="82" width="20" height="20" rx="5" filter="url(#glow)"/>
    </g>
  </g>
  <text x="160" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="58" font-weight="600" letter-spacing="0.5" fill="#e6e8ea">Lucid<tspan fill="#3fd8dc">Performer</tspan></text>
</svg>
